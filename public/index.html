<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>포근펫 상담</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  /* 레이아웃: 한 화면 앱. 위에 상점 헤더와 모드 전환, 아래는 아이폰 메신저형 상담창 또는 관리자 카드 목록 */
  :root {
    --bg: #f4f6fb; --bg-1: #e9f0ff; --bg-2: #f6ecfb; --bg-3: #e9f8f2;
    --glass: rgba(255,255,255,.78); --card: #ffffff; --fg: #15171c; --muted: #646a78; --line: #e1e4ec;
    --blue: #0a84ff; --blue-2: #3b9bff; --bubble: #e9e9eb; --bubble-fg: #000000;
    --ok: #1f8a4c; --ok-soft: #e4f5ea; --warn: #b4531a; --warn-soft: #fff1e4; --bad: #c0362c; --bad-soft: #fde8e6;
    --font: "Noto Sans KR", "Pretendard", -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101217; --bg-1: #131a2c; --bg-2: #1e1426; --bg-3: #0f201b;
      --glass: rgba(28,29,34,.8); --card: #1c1e24; --fg: #eceef3; --muted: #9ea4b3; --line: #2e323c;
      --bubble: #26252a; --bubble-fg: #ffffff;
      --ok: #5fd28f; --ok-soft: #173326; --warn: #f0a46c; --warn-soft: #3a2a1d; --bad: #ff7a6e; --bad-soft: #3d1f1c;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101217; --bg-1: #131a2c; --bg-2: #1e1426; --bg-3: #0f201b;
    --glass: rgba(28,29,34,.8); --card: #1c1e24; --fg: #eceef3; --muted: #9ea4b3; --line: #2e323c;
    --bubble: #26252a; --bubble-fg: #ffffff;
    --ok: #5fd28f; --ok-soft: #173326; --warn: #f0a46c; --warn-soft: #3a2a1d; --bad: #ff7a6e; --bad-soft: #3d1f1c;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    font-family: var(--font); color: var(--fg); font-size: 15px;
    background:
      radial-gradient(1100px 600px at 0% 0%, var(--bg-1), transparent 60%),
      radial-gradient(900px 600px at 100% 30%, var(--bg-2), transparent 60%),
      radial-gradient(900px 700px at 30% 100%, var(--bg-3), transparent 60%),
      var(--bg);
    padding-block: 14px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
  .app { max-width: 760px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  header { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex-shrink: 0; }
  header h1 { margin: 0; font-size: 19px; letter-spacing: -0.02em; }
  header .sub { color: var(--muted); font-size: 12px; }
  .modes { margin-left: auto; display: flex; gap: 4px; background: var(--glass); border: 1px solid var(--line); border-radius: 99px; padding: 3px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .modes button { border: 0; background: transparent; border-radius: 99px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--muted); }
  .modes button[aria-pressed="true"] { background: var(--blue); color: #fff; }
  .notice { flex-shrink: 0; font-size: 13px; padding: 8px 12px; border-radius: 12px; background: var(--warn-soft); color: var(--warn); }

  /* ===== 상담창 ===== */
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--glass); border: 1px solid var(--line); border-radius: 24px; overflow: hidden; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  .chat-head { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 40px 10px; border-bottom: 1px solid var(--line); flex-shrink: 0; text-align: center; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: linear-gradient(180deg, #a8b4c4, #8592a6); }
  .chat-head b { font-size: 13px; font-weight: 500; }
  .chat-head span { font-size: 12px; color: var(--muted); }
  .messages { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 16px 40px 8px; display: flex; flex-direction: column; gap: 3px; }
  .stamp { text-align: center; font-size: 11px; color: var(--muted); margin: 2px 0 8px; }
  .row { display: flex; flex-direction: column; min-width: 0; }
  .row.user { align-items: flex-end; }
  .row.bot { align-items: flex-start; }
  .row + .row.gap { margin-top: 10px; }
  .bubble { max-width: min(78%, 500px); padding: 8px 13px; border-radius: 18px; line-height: 1.4; font-size: 15.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .user .bubble { background: linear-gradient(180deg, var(--blue-2), var(--blue)); color: #fff; }
  .bot .bubble { background: var(--bubble); color: var(--bubble-fg); }
  .user.tail .bubble { border-bottom-right-radius: 5px; }
  .bot.tail .bubble { border-bottom-left-radius: 5px; }
  .meta { font-size: 11px; color: var(--muted); margin: 3px 6px 0; font-variant-numeric: tabular-nums; }
  .meta .fast { color: var(--ok); font-weight: 500; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing span { animation: none; opacity: .6; } }

  .card { max-width: min(88%, 520px); background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
  .card h3 { margin: 0; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 11.5px; font-weight: 500; padding: 2px 8px; border-radius: 99px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; color: var(--muted); font-size: 13px; }
  .kv b { color: var(--fg); font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
  .lines { display: flex; flex-direction: column; gap: 4px; border-top: 1px solid var(--line); padding-top: 8px; }
  .line { display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums; }
  .line.total { font-weight: 700; }
  .timeline { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  .timeline li { display: grid; grid-template-columns: 14px 1fr; gap: 8px; font-size: 13px; }
  .timeline li::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); margin-top: 6px; }
  .timeline li:first-child::before { background: var(--blue); }
  .timeline small { color: var(--muted); display: block; font-variant-numeric: tabular-nums; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; max-width: min(92%, 560px); margin-top: 4px; }
  .pick { border: 1.5px solid var(--blue); background: transparent; color: var(--blue); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; font-weight: 500; }
  .pick:disabled { opacity: .45; cursor: default; }

  .quick { display: flex; gap: 6px; padding: 8px 40px 0; overflow-x: auto; flex-shrink: 0; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .quick button { flex-shrink: 0; border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 7px 13px; font-size: 13.5px; font-weight: 500; }
  .quick button:hover { border-color: var(--blue); color: var(--blue); }
  form.composer { display: flex; gap: 8px; padding: 8px 40px 12px; flex-shrink: 0; align-items: flex-end; }
  .composer textarea { flex: 1; min-width: 0; resize: none; border: 1px solid var(--line); border-radius: 20px; padding: 9px 16px; height: 40px; max-height: 120px; overflow-y: hidden; background: transparent; font-size: 16px; line-height: 1.35; }
  .composer textarea:focus { outline: none; border-color: var(--blue); }
  .send { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--blue); color: #fff; font-size: 18px; flex-shrink: 0; display: grid; place-items: center; }
  .send:disabled { opacity: .45; cursor: default; }

  /* ===== 관리자 ===== */
  .admin { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 10px; }
  .admin-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex-shrink: 0; }
  .seg { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 4px; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 4px; flex: 1 1 360px; }
  .seg button { border: 0; background: transparent; border-radius: 10px; padding: 8px 4px; font-size: 13.5px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .seg small { font-variant-numeric: tabular-nums; margin-left: 2px; }
  .btn { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 7px 12px; font-size: 13px; font-weight: 500; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.danger { color: var(--bad); }
  .btn:disabled { opacity: .45; cursor: default; }
  .admin-hint { font-size: 12.5px; color: var(--muted); flex-shrink: 0; }
  .list { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-bottom: 8px; }
  .rec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
  .rec.dirty { border-color: var(--blue); }
  .rec.new { border-style: dashed; border-color: var(--blue); }
  .rec-head { display: flex; align-items: center; gap: 8px; }
  .rec-head b { font-size: 14px; font-variant-numeric: tabular-nums; }
  .rec-head .state { font-size: 12px; color: var(--muted); margin-left: auto; }
  .rec-head .state.on { color: var(--blue); }
  .fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 10px; }
  .fields label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); min-width: 0; }
  .fields label.wide { grid-column: 1 / -1; }
  .fields input, .fields select, .fields textarea { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 14px; background: var(--bg); color: var(--fg); min-width: 0; width: 100%; }
  .fields textarea { resize: vertical; min-height: 60px; line-height: 1.45; }
  .rec-actions { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: wrap; }
  .rec-actions .err { font-size: 12px; color: var(--bad); margin-right: auto; align-self: center; }
  .empty { text-align: center; color: var(--muted); padding: 40px 16px; font-size: 14px; }

  /* 상품 이미지 */
  .art { display: block; flex-shrink: 0; }
  .prod { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .prod > div { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .line .item { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .lines .line { align-items: center; }

  /* 대화 기록 · 피드백 */
  .stats { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .stats b { color: var(--fg); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .toolbar select { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; background: var(--bg); color: var(--fg); font-size: 13px; }
  .pair { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 6px; }
  .pair:first-of-type { border-top: 0; padding-top: 0; }
  .say { display: grid; grid-template-columns: 34px 1fr; gap: 8px; font-size: 14px; line-height: 1.5; }
  .say .who { font-size: 12px; color: var(--muted); padding-top: 1px; }
  .say .txt { white-space: pre-wrap; overflow-wrap: anywhere; min-width: 0; }
  .say.bot .txt { background: var(--bg); border-radius: 10px; padding: 6px 10px; }
  .kind { display: inline-block; font-size: 11px; font-weight: 500; border-radius: 99px; padding: 1px 7px; margin-right: 6px; background: var(--ok-soft); color: var(--ok); }
  .kind.ai { background: rgba(10,132,255,.12); color: var(--blue); }
  .say .txt .kind { display: table; margin-bottom: 4px; }
  .kind.error { background: var(--bad-soft); color: var(--bad); }
  .fb { margin-left: 42px; display: flex; flex-direction: column; gap: 6px; }
  .fb-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .rate { border: 1px solid var(--line); background: var(--card); border-radius: 99px; padding: 4px 10px; font-size: 13px; }
  .rate[aria-pressed="true"].good { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
  .rate[aria-pressed="true"].bad { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); }
  .fb textarea { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; font-size: 13.5px; background: var(--bg); color: var(--fg); resize: vertical; min-height: 54px; line-height: 1.45; width: 100%; }
  .fb label.chk { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 5px; align-items: center; }
  .fb .saved { font-size: 12px; color: var(--ok); }
  .preview { background: var(--bg); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; line-height: 1.55; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 220px; overflow-y: auto; color: var(--fg); }
  .ctx { font-size: 12.5px; color: var(--muted); }
  .ctx b { color: var(--fg); font-weight: 500; }

  .keybox { flex-shrink: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .keyrow { display: flex; gap: 6px; flex-wrap: wrap; }
  .keyrow input { flex: 1 1 220px; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 14px; background: var(--bg); color: var(--fg); }
  .key-state { font-variant-numeric: tabular-nums; }

  /* 관리자 비밀번호 창 */
  .overlay { position: fixed; inset: 0; z-index: 20; background: rgba(10, 12, 18, .45); display: grid; place-items: center; padding: 16px; }
  .lock { width: min(340px, 100%); background: var(--card); color: var(--fg); border: 1px solid var(--line); border-radius: 18px; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .lock h2 { margin: 0; font-size: 17px; }
  .lock p { margin: 0; font-size: 13px; color: var(--muted); }
  .lock input { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 18px; letter-spacing: .2em; background: var(--bg); color: var(--fg); }
  .lock-err { min-height: 18px; font-size: 12.5px; color: var(--bad); }
  .lock-actions { display: flex; justify-content: flex-end; gap: 6px; }

  @media (max-width: 560px) {
    body { padding-block: 8px; }
    header h1 { font-size: 17px; }
    header .sub { display: none; }
    .messages, .chat-head, .quick, form.composer { padding-left: 18px; padding-right: 18px; }
    .bubble { max-width: 84%; font-size: 15px; }
    .card { max-width: 96%; }
    .seg { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .fb { margin-left: 0; }
  }
</style>
</head>
<body>

<div class="app">
  <header>
    <div>
      <h1>🐾 포근펫</h1>
      <div class="sub">반려동물 용품 · 가상 상점 데모</div>
    </div>
  </header>
  <div class="notice" id="notice" hidden></div>

  <!-- 상담 화면 -->
  <section class="chat" id="chatView" aria-label="상담">
    <div class="chat-head">
      <div class="avatar" aria-hidden="true">🐶</div>
      <b>포근펫 AI 상담원 ›</b>
      <span>주문·배송·재고는 바로, 그 밖의 질문은 AI가 답해요</span>
    </div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <div class="quick" id="quick">
      <button type="button" data-q="order">📦 주문 조회</button>
      <button type="button" data-q="ship">🚚 배송 조회</button>
      <button type="button" data-q="stock">🔍 재고 확인</button>
      <button type="button" data-q="rec">🐾 상품 추천</button>
    </div>
    <form class="composer" id="composer">
      <textarea id="input" rows="1" placeholder="주문번호(예: ORD-1003)나 궁금한 점을 입력하세요" aria-label="메시지"></textarea>
      <button class="send" id="sendBtn" aria-label="보내기">↑</button>
    </form>
  </section>

  <!-- 관리자 화면 -->
  <section class="admin" id="adminView" hidden aria-label="관리자">
    <div class="admin-bar">
      <div class="seg" id="seg">
        <button type="button" data-col="products" aria-pressed="true">상품<small></small></button>
        <button type="button" data-col="inventory" aria-pressed="false">재고<small></small></button>
        <button type="button" data-col="orders" aria-pressed="false">주문<small></small></button>
        <button type="button" data-col="shipments" aria-pressed="false">배송<small></small></button>
        <button type="button" data-col="logs" aria-pressed="false">대화 기록<small></small></button>
        <button type="button" data-col="rules" aria-pressed="false">피드백 지침<small></small></button>
      </div>
      <button class="btn primary" type="button" id="addBtn">+ 새로 추가</button>
      <button class="btn" type="button" id="exitAdmin">상담 화면으로</button>
    </div>
    <div class="admin-hint" id="adminHint">고친 뒤 저장을 누르면 상담원이 바로 새 데이터로 답해요. Ctrl+Shift+A 또는 Esc로 상담 화면으로 돌아가요.</div>
    <div class="list" id="list"></div>
  </section>
</div>

<!-- 관리자 비밀번호 창 (Ctrl+Shift+A) -->
<div class="overlay" id="lock" hidden>
  <form class="lock" id="lockForm" role="dialog" aria-modal="true" aria-labelledby="lockTitle">
    <h2 id="lockTitle">관리자 로그인</h2>
    <p>관리자 비밀번호를 입력하세요.</p>
    <input id="lockPw" type="password" inputmode="numeric" autocomplete="off" aria-label="관리자 비밀번호">
    <div class="lock-err" id="lockErr" aria-live="polite"></div>
    <div class="lock-actions">
      <button class="btn" type="button" id="lockCancel">취소</button>
      <button class="btn primary" type="submit">들어가기</button>
    </div>
  </form>
</div>

<script>
/* =========================================================
   1) 데이터 구조 — 관리자 화면 입력칸도 이 정의로 만들어짐
   ========================================================= */
const ORDER_STATUS = ["결제완료", "상품준비중", "배송중", "배송완료", "취소"];
const SHIP_STATUS = ["집하대기", "집하완료", "간선이동", "배송출발", "배송완료"];
const SCHEMA = {
  products: { label: "상품", idLabel: "상품 ID", idHint: "P011", fields: [
    { k: "name", label: "상품명" }, { k: "category", label: "카테고리" },
    { k: "price", label: "가격(원)", type: "number" }, { k: "tags", label: "태그 (쉼표로 구분)" },
    { k: "emoji", label: "이미지 아이콘 (이모지 1개)" }, { k: "color", label: "이미지 색 (#RRGGBB)" },
    { k: "description", label: "설명", type: "textarea", wide: true } ] },
  inventory: { label: "재고", idLabel: "상품 ID", idHint: "P011", fields: [
    { k: "stock", label: "재고 수량", type: "number" }, { k: "warehouse", label: "보관 창고" },
    { k: "restockDate", label: "입고 예정일" } ] },

// 1) 빈 줄로 나뉜 덩어리마다 한 말풍선  2) 한 덩어리가 MAX자를 넘으면 문장 단위로 다시 나눔
const BUBBLE_MAX = 70;
function splitBubbles(text) {
  const out = [];
  String(text).trim().split(/\n\s*\n/).forEach((para) => {
    para = para.trim();
    if (!para) return;
    if (para.length <= BUBBLE_MAX) { out.push(para); return; }
    const sentences = para.split(/(?<=[.!?。])\s+|\n/).map((s) => s.trim()).filter(Boolean);
    let cur = "";
    sentences.forEach((s) => {
      if (cur && (cur + " " + s).length > BUBBLE_MAX) { out.push(cur); cur = s; }
      else cur = cur ? cur + " " + s : s;
    });
    if (cur) out.push(cur);
  });
  return out.length ? out : [String(text)];
}
// 정해진 안내 문장도 같은 방식으로 나눠 보냄 (시간 표시는 마지막 말풍선에만)
function botTexts(text, t0, memo) {
  const parts = splitBubbles(text);
  parts.forEach((p, i) => addRow("bot", h("div", { class: "bubble", text: p }), i === parts.length - 1 ? meta("data", performance.now() - t0) : null));
  if (memo) history.push({ role: "assistant", content: memo });
  logMsg("bot", text, { kind: "data", ms: Math.round(performance.now() - t0) });
}

/* --- 파일 모드용 Claude API 키: 이 브라우저(localStorage)에만 저장, 파일에는 들어가지 않음 --- */
const KEY_STORE = "pogeunpet.claudeKey";
let memKey = "";
function getKey() { try { return localStorage.getItem(KEY_STORE) || memKey; } catch { return memKey; } }
function setKey(v) { memKey = v; try { v ? localStorage.setItem(KEY_STORE, v) : localStorage.removeItem(KEY_STORE); } catch {} }

// Claude API를 브라우저에서 직접 호출 (스트리밍: 답이 쓰이는 대로 보여줌)
async function claudeApi(key, onText) {
  const msgs = history.slice(-12);
  while (msgs[0]?.role === "assistant") msgs.shift();
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": key,
      "anthropic-version": "2026-10-21",
      "anthropic-beta": "server-side-fallback-2026-07-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-opus-5-5",
      max_tokens: 4096,
      stream: true,
      output_config: { effort: "low" },   // 상담 채팅은 빠른 답이 중요
      fallbacks: "default",                // 모델이 거절하면 서버가 다른 모델로 이어서 답함
      system: systemPrompt(),
      messages: msgs,
    }),
  });
  return readStream(res, onText);
}

// 로컬 서버를 거쳐 호출: 서버가 '운영자 피드백 지침'을 붙여서 Claude에 보냄
async function claudeViaServer(onText) {
  const key = getKey();
  const res = await fetch("/api/chat", {
    method: "POST",
    headers: { "content-type": "application/json", ...(key ? { "x-api-key": key } : {}) },
    body: JSON.stringify({ system: RULES + "\n\n" + storeContext(), messages: history.slice(-12) }),   // 지침은 서버가 붙임
  });
  const guides = Number(res.headers.get("x-guides-count")) || 0;
  return { text: await readStream(res, onText), guides };
}

// 스트리밍 응답(SSE)을 읽어 답이 쓰이는 대로 onText에 넘김
async function readStream(res, onText) {
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    const type = err?.error?.type;
    throw { code: type === "no_key" ? "no_key" : res.status === 401 ? "bad_key" : res.status === 429 ? "rate_limited" : "api", message: err?.error?.message || "HTTP " + res.status };
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = "", text = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf("\n\n")) >= 0) {
      const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
      const line = chunk.split("\n").find((l) => l.startsWith("data:"));
      if (!line) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      if (ev.type === "content_block_delta" && ev.delta?.type === "text_delta") { text += ev.delta.text; onText(text); }
      else if (ev.type === "message_delta" && ev.delta?.stop_reason === "refusal") throw { code: "refused" };
      else if (ev.type === "error") throw { code: "api", message: ev.error?.message, text };
    }
  }
  if (!text.trim()) throw { code: "empty" };
  return text;
}

async function aiAnswer() {
  const t0 = performance.now();
  const row = addRow("bot", h("div", { class: "bubble" }, h("span", { class: "typing" }, h("span"), h("span"), h("span"))));
  const bubble = $(".bubble", row);
  const sample = offline ? null : await cap("sample");
  const key = sample ? "" : getKey();
  const viaServer = !sample && !!server && (server.serverKey || !!key);
  if (!sample && !key && !viaServer) { bubble.textContent = "AI 답변은 Claude 아티팩트에서 열거나, 관리자 화면에 API 키를 넣으면 동작해요."; logMsg("bot", bubble.textContent, { kind: "error" }); return; }
  let first = 0;
  // 답이 쓰이는 대로 여러 말풍선에 나눠 보여줌 (첫 말풍선 = 입력 중 표시가 있던 자리)
  const rows = [row];
  const show = (t) => {
    if (!first) first = performance.now() - t0;
    const parts = splitBubbles(t);
    parts.forEach((p, i) => {
      if (!rows[i]) rows[i] = addRow("bot", h("div", { class: "bubble" }));
      $(".bubble", rows[i]).textContent = p;
    });
    rows.splice(parts.length).forEach((r) => r.remove());
    refreshTails();
    box.scrollTop = box.scrollHeight;
  };
  let guides = activeRules().length;
  const turns = [{ role: "user", content: systemPrompt() }, ...history.slice(-12)];
  if (turns[1]?.role === "assistant") turns.splice(1, 0, { role: "user", content: "(이전 대화)" });
  try {
    let text;
    if (sample) text = (await sample(turns, { modelTier: "quick", cache: false, onText: ({ text }) => show(text) })).text;
    else if (viaServer) { const r = await claudeViaServer(show); text = r.text; guides = r.guides; }   // 서버가 실제로 붙인 지침 수
    else text = await claudeApi(key, show);
    show(text.trim());
    history.push({ role: "assistant", content: text.trim() });
    rows.at(-1).append(meta("ai", first || performance.now() - t0));
    logMsg("bot", text.trim(), { kind: "ai", ms: Math.round(first || performance.now() - t0), guides });
  } catch (e) {
    history.pop();
    rows.splice(1).forEach((r) => r.remove());
    bubble.textContent = e?.text || "";
    if (!e?.text) bubble.textContent = "⚠️ " + (SAMPLE_ERR[e?.code] || (e?.message ? "AI 연결 오류: " + e.message : "잠시 연결이 끊겼어요. 다시 보내 주세요."));
    logMsg("bot", bubble.textContent, { kind: "error" });
  }
}

async function send(text) {
  text = text.trim();
  if (!text || busy) return;
  addText("user", text);
  history.push({ role: "user", content: text });
  if (!loaded) { addText("bot", "상점 데이터를 불러오는 중이에요. 잠시 후 다시 보내 주세요."); history.pop(); return; }
  if (instantAnswer(text)) return;
  if (offline && !getKey() && !server?.serverKey) { offlineAnswer(text); return; }
  busy = true; $("#sendBtn").disabled = true;
  try { await aiAnswer(); } finally { busy = false; $("#sendBtn").disabled = false; }
}

// AI를 쓸 수 없을 때(파일로 직접 열었을 때) 자주 묻는 질문은 데이터와 정책으로 바로 답함
function offlineAnswer(text) {
  const t0 = performance.now();
  const say = (msg) => botTexts(msg, t0, msg);
  if (/교환|반품|환불|취소/.test(text))
    return say("상품을 받으신 날부터 7일 안에 마이페이지 > 주문내역에서 신청하실 수 있어요.\n단순 변심은 왕복 배송비 6,000원이 들고, 불량·오배송은 무료예요. 환불은 반품 확인 후 영업일 3일 안에 처리돼요.");
  if (/배송비|무료\s?배송|출고|도착|언제\s?(와|오)|배송\s?기간|며칠/.test(text))
    return say("평일 오후 2시 전 주문은 당일 출고되고, 보통 1~3일 안에 받아보실 수 있어요.\n3만 원 이상 구매하시면 무료배송, 그 미만은 배송비 3,000원이에요.");
  // 상품 이름의 단어가 질문에 많이(길게) 겹칠수록 높은 점수. '고양이', '강아지' 같은 흔한 단어는 빼고 셈
  const COMMON = ["고양이", "강아지", "세트", "대형"];
  const words = (name) => String(name).split(/[\s·/]+/).map((w) => w.replace(/[0-9a-zA-Z.]+$/, "")).filter((w) => w.length >= 2 && !COMMON.includes(w));
  const score = (p) => words(p.name).reduce((s, w) => s + (text.includes(w) ? w.length : 0), 0);
  const ranked = Object.entries(data.products).map(([id, p]) => [id, p, score(p)]).filter((x) => x[2] > 0).sort((a, b) => b[2] - a[2]);
  const hit = ranked[0];
  if (hit) { botData(stockCard(hit[0]), t0, `${hit[1].name} 재고는 ${data.inventory[hit[0]]?.stock ?? "?"}개예요.`); return; }
  const pet = /고양이|냥/.test(text) ? "고양이" : /강아지|개|멍/.test(text) ? "강아지" : "";
  if (pet) return recommend(pet);
  say("이 질문은 AI 상담이 필요해요. Claude 아티팩트 링크로 열면 AI가 답해 드려요.\n여기서는 주문번호·운송장 조회, 상품 이름 검색, 배송·교환 안내, 아래 버튼 메뉴를 바로 쓸 수 있어요.");
}

let current = "products", dbRef = null;
const dirty = { products: false, inventory: false, orders: false, shipments: false };

function fieldInput(f, val) {
  if (f.type === "textarea") return h("textarea", {}, String(val ?? ""));
  if (f.type === "select") {
    const sel = h("select");
    const opts = f.options.includes(val) || !val ? f.options : [val, ...f.options];
    opts.forEach((o) => sel.append(h("option", { value: o, text: o })));
    sel.value = val || f.options[0];
    return sel;
  }
  const inp = h("input", { type: f.type === "number" ? "number" : "text", inputmode: f.type === "number" ? "numeric" : null });
  inp.value = val ?? "";
  return inp;
}
function recordCard(col, id, rec, isNew) {
  const sc = SCHEMA[col];
  const card = h("div", { class: "rec" + (isNew ? " new" : "") });
  const idInput = isNew ? h("input", { type: "text", placeholder: "예: " + sc.idHint, id: `${col}-new-id` }) : null;
  const artBox = col === "products" ? h("span", {}, productArt(rec, 40)) : null;
  card.append(h("div", { class: "rec-head" }, artBox,
    isNew ? h("b", { text: "새 " + sc.label }) : h("b", { text: id }),
    h("span", { class: "state", text: isNew ? "" : col === "inventory" ? productName(id) : col === "products" ? (rec.name || "") : col === "orders" ? (rec.status || "") : (rec.orderId || "") })));
  const fields = h("div", { class: "fields" });
  if (isNew) fields.append(h("label", { for: idInput.id }, sc.idLabel, idInput));
  const inputs = {};
  sc.fields.forEach((f) => {
    const el = fieldInput(f, rec[f.k]);
    el.id = `${col}-${id || "new"}-${f.k}`;
    inputs[f.k] = el;
    fields.append(h("label", { class: f.wide ? "wide" : "", for: el.id }, f.label, el));
  });
  card.append(fields);
  const err = h("span", { class: "err" });
  const save = h("button", { type: "button", class: "btn primary", text: isNew ? "추가" : "저장", disabled: isNew ? null : "" });
  const del = isNew ? h("button", { type: "button", class: "btn", text: "취소" }) : h("button", { type: "button", class: "btn danger", text: "삭제" });
  card.append(h("div", { class: "rec-actions" }, err, del, save));
  const markDirty = () => { if (!isNew) { card.classList.add("dirty"); save.disabled = false; dirty[col] = true; } };
  card.addEventListener("input", markDirty);
  if (artBox) card.addEventListener("input", () => {
    const live = {}; sc.fields.forEach((f) => { live[f.k] = inputs[f.k].value; });
    artBox.replaceChildren(productArt(live, 40));
  });
  card.addEventListener("change", markDirty);
  save.addEventListener("click", async () => {
    err.textContent = "";
    const docId = isNew ? idInput.value.trim() : id;
    if (!docId) { err.textContent = sc.idLabel + "를 입력해 주세요."; idInput.focus(); return; }
    if (!/^[A-Za-z0-9_\-.~:@+]+$/.test(docId)) { err.textContent = "ID에는 영문, 숫자, - 만 쓸 수 있어요."; return; }
    if (isNew && data[col][docId]) { err.textContent = "이미 있는 ID예요."; return; }
    const body = {};
    sc.fields.forEach((f) => { const v = inputs[f.k].value; body[f.k] = f.type === "number" ? Number(v) || 0 : v.trim(); });
    save.disabled = true; save.textContent = "저장 중…";
    try {
      await dbRef.doc(`${col}/${docId}`).set(body);
      dirty[col] = false;
      renderList(true);
    } catch (e) {
      save.disabled = false; save.textContent = isNew ? "추가" : "저장";
      err.textContent = e?.code === "invalid_argument" ? "저장 권한이 없거나 입력값이 올바르지 않아요." : "저장하지 못했어요. 다시 눌러 주세요.";
    }
  });
  del.addEventListener("click", async () => {
    if (isNew) { card.remove(); return; }
    if (del.dataset.confirm !== "1") { del.dataset.confirm = "1"; del.textContent = "정말 삭제"; setTimeout(() => { del.dataset.confirm = ""; del.textContent = "삭제"; }, 3000); return; }
    del.disabled = true;
    try { await dbRef.doc(`${col}/${id}`).delete(); dirty[col] = false; renderList(true); }
    catch { del.disabled = false; err.textContent = "삭제하지 못했어요."; }
  });
  return card;
}

// 관리자 진입: Ctrl+Shift+A (맥은 ⌘+Shift+A) → 비밀번호 확인
// 비밀번호는 원문 대신 SHA-256 값만 페이지에 둠
const ADMIN_HASH = "bb5a52f42f9c9261ed4361f59422a1e30036e7c32b270c8807a419feca605023";
let unlocked = false, canWrite = null;
const lock = $("#lock"), lockPw = $("#lockPw"), lockErr = $("#lockErr");
// SHA-256 직접 계산 (파일로 열어도 동작하도록 브라우저 보안 기능에 의존하지 않음)
function sha256(text) {
  const ror = (x, n) => (x >>> n) | (x << (32 - n));
  const frac = (x) => ((x - Math.floor(x)) * 4294967296) | 0;
  const H = [], K = [];
  for (let n = 2, i = 0; i < 64; n++) {
    let prime = true;
    for (let f = 2; f * f <= n; f++) if (n % f === 0) { prime = false; break; }
    if (prime) { if (i < 8) H[i] = frac(Math.pow(n, 1 / 2)); K[i++] = frac(Math.pow(n, 1 / 3)); }
  }
  const bytes = new TextEncoder().encode(text);
  const total = Math.ceil((bytes.length + 9) / 64) * 64;
  const m = new Uint8Array(total); m.set(bytes); m[bytes.length] = 0x80;
  const v = new DataView(m.buffer); v.setUint32(total - 4, bytes.length * 8);
  const W = new Array(64);
  for (let off = 0; off < total; off += 64) {
    for (let t = 0; t < 64; t++) {
      if (t < 16) W[t] = v.getUint32(off + t * 4);
      else {
        const s0 = ror(W[t - 15], 7) ^ ror(W[t - 15], 18) ^ (W[t - 15] >>> 3);
        const s1 = ror(W[t - 2], 17) ^ ror(W[t - 2], 19) ^ (W[t - 2] >>> 10);
        W[t] = (W[t - 16] + s0 + W[t - 7] + s1) | 0;
      }
    }
    let [a, b, c, d, e, f, g, hh] = H;
    for (let t = 0; t < 64; t++) {
      const t1 = (hh + (ror(e, 6) ^ ror(e, 11) ^ ror(e, 25)) + ((e & f) ^ (~e & g)) + K[t] + W[t]) | 0;
      const t2 = ((ror(a, 2) ^ ror(a, 13) ^ ror(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      hh = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    [a, b, c, d, e, f, g, hh].forEach((x, i) => { H[i] = (H[i] + x) | 0; });
  }
  return H.map((x) => (x >>> 0).toString(16).padStart(8, "0")).join("");
}

// 파일 모드용 저장소: 관리자에서 고친 내용은 이 브라우저(localStorage)에만 저장됨
function localDb() {
  const KEY = "pogeunpet.data.v1";
  const fresh = () => JSON.parse(JSON.stringify(SEED));
  let store = null;
  try { store = JSON.parse(localStorage.getItem(KEY)); } catch {}
  if (!store || typeof store !== "object") store = fresh();
  const subs = {};
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch {} };
  const emit = (c) => (subs[c] || []).forEach((fn) => fn({
    docs: Object.entries(store[c] || {}).map(([id, d]) => ({ id, data: () => d })), metadata: { fromCache: false } }));
  return {
    collection: (c) => ({ onSnapshot(next) { (subs[c] ||= []).push(next); setTimeout(() => emit(c)); return () => {}; } }),
    doc(path) {
      const [c, id] = path.split("/");
      return {
        async set(body) { (store[c] ||= {})[id] = body; save(); emit(c); },
        async delete() { if (store[c]) delete store[c][id]; save(); emit(c); },
      };
    },
    reset() { store = fresh(); save(); COLS.forEach(emit); },
  };
}
